[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-workbench-alan-vo"
version = "1.0.0"
description = "Semantic topic slicing, low-token hybrid retrieval, and preregistered evaluation workbench for AI agent session memory."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Alan Vo", email = "alanvo@gmail.com" }
]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "pydantic==2.10.4",
  "httpx==0.28.1"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4"
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
